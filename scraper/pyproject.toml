[project]
name = "ranks-scraper"
version = "0.1.0"
description = "Scrapy spiders for ranks.urm8.org source ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.12.0",
    "scrapy-playwright>=0.0.42",
    "playwright>=1.49.0",
    "itemadapter>=0.9.0",
    "pg8000>=1.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
ranks-crawl-all = "ranks_scraper.runners.crawl_all:main"
ranks-list-spiders = "ranks_scraper.runners.list_spiders:main"
ranks-publish-snapshot = "ranks_scraper.runners.publish_snapshot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ranks_scraper"]

[tool.uv]
package = true
