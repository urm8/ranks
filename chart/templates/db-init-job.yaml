apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ranks.fullname" . }}-db-init
  namespace: {{ .Values.ranks.database.adminNamespace }}
  labels:
    {{- include "ranks.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "ranks.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: "{{ .Values.ranks.database.initJob.image.repository }}:{{ .Values.ranks.database.initJob.image.tag }}"
          imagePullPolicy: {{ .Values.ranks.database.initJob.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ .Values.ranks.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.ranks.database.port | quote }}
            - name: PGUSER
              value: {{ .Values.ranks.database.adminUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ranks.database.adminSecretName }}
                  key: {{ .Values.ranks.database.adminSecretKey }}
            - name: RANKS_DB_NAME
              value: {{ .Values.ranks.database.name | quote }}
            - name: RANKS_DB_USER
              value: {{ .Values.ranks.database.user | quote }}
            - name: RANKS_DB_PASSWORD
              value: {{ .Values.ranks.database.password | quote }}
          command:
            - sh
            - -ec
            - |
              set -e
              psql_q() {
                psql -d postgres -v ON_ERROR_STOP=on -t -A "$@"
              }
              sql_escape() {
                printf "%s" "$1" | sed "s/'/''/g"
              }
              DB_USER_ESC=$(sql_escape "$RANKS_DB_USER")
              DB_PASS_ESC=$(sql_escape "$RANKS_DB_PASSWORD")
              DB_NAME_ESC=$(sql_escape "$RANKS_DB_NAME")
              ROLE_EXISTS=$(psql_q -c "SELECT 1 FROM pg_roles WHERE rolname = '${DB_USER_ESC}'")
              if [ "$ROLE_EXISTS" = "1" ]; then
                psql_q -c "ALTER ROLE \"${RANKS_DB_USER}\" WITH LOGIN PASSWORD '${DB_PASS_ESC}'"
              else
                psql_q -c "CREATE ROLE \"${RANKS_DB_USER}\" WITH LOGIN PASSWORD '${DB_PASS_ESC}'"
              fi
              DB_EXISTS=$(psql_q -c "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME_ESC}'")
              if [ "$DB_EXISTS" != "1" ]; then
                psql_q -c "CREATE DATABASE \"${RANKS_DB_NAME}\" OWNER \"${RANKS_DB_USER}\""
              fi
              psql -d "$RANKS_DB_NAME" -v ON_ERROR_STOP=on -c "GRANT ALL PRIVILEGES ON SCHEMA public TO \"${RANKS_DB_USER}\""
              echo "ranks role and database are ready"
