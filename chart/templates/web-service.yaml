apiVersion: v1
kind: Service
metadata:
  name: {{ include "ranks.fullname" . }}-web
  labels:
    {{- include "ranks.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "ranks.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.ranks.web.service.port }}
      targetPort: http
