# Build GHCR images and helm-deploy on push to master.
# Deploy credentials and chart values live in the production environment secrets.

name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-ranks-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: urm8
  IMAGE_PLATFORM: linux/arm64
  RELEASE: ranks
  NAMESPACE: ranks

jobs:
  build-and-deploy:
    name: Build images and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          RANKS_CHART_VALUES_B64: ${{ secrets.RANKS_CHART_VALUES_B64 }}
          RANKS_DB_PASSWORD: ${{ secrets.RANKS_DB_PASSWORD }}
        run: |
          missing=0
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::Missing deploy kubeconfig secret"
            missing=1
          fi
          if [ -z "$RANKS_CHART_VALUES_B64" ]; then
            echo "::error::Missing chart values secret"
            missing=1
          fi
          if [ -z "$RANKS_DB_PASSWORD" ]; then
            echo "::warning::DB password secret unset; helm will --reuse-values for the password (upgrade only)"
          fi
          exit "$missing"

      - name: Materialize chart values
        env:
          RANKS_CHART_VALUES_B64: ${{ secrets.RANKS_CHART_VALUES_B64 }}
        run: |
          umask 077
          printf '%s' "$RANKS_CHART_VALUES_B64" | base64 --decode > ./chart/values.yaml

      - name: Set image tag
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          platforms: ${{ env.IMAGE_PLATFORM }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ranks-api:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ranks-api:latest
          cache-from: type=gha,scope=ranks-api
          cache-to: type=gha,mode=max,scope=ranks-api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          platforms: ${{ env.IMAGE_PLATFORM }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ranks-web:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ranks-web:latest
          cache-from: type=gha,scope=ranks-web
          cache-to: type=gha,mode=max,scope=ranks-web

      - name: Build and push scraper image
        uses: docker/build-push-action@v6
        with:
          context: ./scraper
          push: true
          platforms: ${{ env.IMAGE_PLATFORM }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ranks-scraper:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ranks-scraper:latest
          cache-from: type=gha,scope=ranks-scraper
          cache-to: type=gha,mode=max,scope=ranks-scraper

      - name: Make GHCR packages public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Public repo + empty imagePullSecrets => packages must be pullable anonymously.
          for pkg in ranks-api ranks-web ranks-scraper; do
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/${pkg}/visibility" \
              -f visibility=public \
              || gh api \
                --method PUT \
                -H "Accept: application/vnd.github+json" \
                "/orgs/${IMAGE_OWNER}/packages/container/${pkg}/visibility" \
                -f visibility=public \
              || echo "Could not set visibility for ${pkg} (may already be public or need manual toggle)"
          done

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.0

      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

      - name: Helm lint
        run: helm lint ./chart

      - name: Deploy with Helm
        env:
          RANKS_DB_PASSWORD: ${{ secrets.RANKS_DB_PASSWORD }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          # Prefer explicit password secret. If unset, --reuse-values keeps the
          # existing release password (still fails on first install).
          set -- \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set ranks.scraperCron.enabled=true \
            --set ranks.api.image.repository="${REGISTRY}/${IMAGE_OWNER}/ranks-api" \
            --set ranks.api.image.tag="$IMAGE_TAG" \
            --set ranks.api.image.pullPolicy=Always \
            --set ranks.web.image.repository="${REGISTRY}/${IMAGE_OWNER}/ranks-web" \
            --set ranks.web.image.tag="$IMAGE_TAG" \
            --set ranks.web.image.pullPolicy=Always \
            --set ranks.scraperCron.image.repository="${REGISTRY}/${IMAGE_OWNER}/ranks-scraper" \
            --set ranks.scraperCron.image.tag="$IMAGE_TAG" \
            --set ranks.scraperCron.image.pullPolicy=Always \
            --wait \
            --timeout=10m

          if [ -n "$RANKS_DB_PASSWORD" ]; then
            set -- "$@" --set ranks.database.password="$RANKS_DB_PASSWORD"
          else
            echo "RANKS_DB_PASSWORD unset; reusing existing helm values for DB password"
            set -- "$@" --reuse-values
          fi

          helm upgrade --install "$RELEASE" ./chart "$@"

      - name: Cluster status on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get deploy,pods,ingress,cronjob -o wide || true
          kubectl -n "$NAMESPACE" describe deploy -l app.kubernetes.io/instance="$RELEASE" || true

      - name: Verify public endpoint
        run: |
          curl -fsSLI --retry 8 --retry-delay 5 --retry-all-errors https://ranks.urm8.org/ >/dev/null
          curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors https://ranks.urm8.org/healthz >/dev/null
