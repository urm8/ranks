[project]
name = "ranks-api"
version = "0.1.0"
description = "FastAPI backend for ranks.urm8.org — serves Postgres snapshot data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
ranks-api = "ranks_api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ranks_api"]

[tool.uv]
package = true
